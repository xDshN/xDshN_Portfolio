name: Deploy portfolio to GitHub Pages

# Сайт статический: собирать нечего, workflow только публикует файлы.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect the site files
        shell: bash
        run: |
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name _site ! -name README.md ! -name .gitignore \
            -exec cp -a {} _site/ \;

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
